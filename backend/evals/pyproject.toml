[project]
name = "evals"
version = "0.1.0"
description = "Evaluation sets for Samruddhi AI's narratives, and audit-log replay"
requires-python = ">=3.12"
dependencies = [
    "samruddhi-database",
    "boto3>=1.40.9",
    "numpy>=2.3",
    "openai-agents[litellm]==0.2.6",
    "litellm==1.75.5.post1",
    "pandas>=2.3",
    "pydantic>=2.11.7",
    "python-dotenv>=1.1.1",
    "tenacity>=9.1.2",
    "langfuse==3.3.4",
    "logfire==4.7.0",
]

[tool.uv.sources]
samruddhi-database = { path = "../database", editable = true }
